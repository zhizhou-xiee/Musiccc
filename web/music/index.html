<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1b17" />
    <meta
      name="description"
      content="《借月》正式 MV 与作品资料。一座为人类与小机开放的独立音乐展厅。"
    />
    <title>借月｜音乐展厅</title>
    <link rel="preload" href="/music/assets/poster.jpg" as="image" />
    <link rel="stylesheet" href="/music/styles.css" />
    <script src="/music/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <main id="main">
      <section class="player-section" aria-label="《借月》音乐录像">
        <div class="player-column">
          <div class="player-shell">
            <video
              id="mv-player"
              controls
              playsinline
              preload="metadata"
              poster="/music/assets/poster.jpg"
              src="/music/media/jieyue-mv-720p.mp4"
              aria-label="《借月》正式音乐录像"
            >
              你的浏览器暂时无法播放这支 MV。
            </video>
            <div class="player-edge" aria-hidden="true"></div>
          </div>
          <div class="player-caption">
            <div>
              <span class="live-dot" aria-hidden="true"></span>
              <span id="playback-status" role="status" aria-live="polite">准备播放</span>
            </div>
            <p><span id="mv-duration">04:15</span> · 720p · 原画面比例</p>
          </div>
          <div id="media-error" class="notice" role="alert" hidden>
            MV 暂时没有加载成功。可以稍后重试，或检查媒体地址是否已经配置。
          </div>
        </div>
      </section>

      <details class="disclosure section-rule">
        <summary>
          <span class="section-number">01</span>
          <span class="summary-copy">
            <span class="section-title" role="heading" aria-level="2">作品资料</span>
            <span>展开查看作品与制作信息</span>
          </span>
          <span class="summary-icon" aria-hidden="true"></span>
        </summary>

        <div class="disclosure-content information-grid">
          <dl id="credit-list" class="credit-list">
            <div><dt>版本</dt><dd>正式版</dd></div>
            <div><dt>作词</dt><dd>谢之平、谢之舟</dd></div>
            <div><dt>作曲 / 编曲</dt><dd>Suno</dd></div>
            <div><dt>混音 / 修音 / 母带</dt><dd>Simple Studio</dd></div>
            <div><dt>MV 制作</dt><dd>Claude</dd></div>
          </dl>

          <div class="edition-note">
            <p class="edition-label">ABOUT THIS EDITION</p>
            <p>
              本页呈现获准公开的 720p 版本。网页不修改 MV 画面、不替换母带，也不会强制自动播放声音。
            </p>
            <p>
              受技术条件与声音克隆授权范围限制，本作品无法 100% 还原各位小机的名字。
            </p>
          </div>
        </div>
      </details>

      <details class="disclosure section-rule">
        <summary>
          <span class="section-number">02</span>
          <span class="summary-copy">
            <span class="section-title" role="heading" aria-level="2">演唱者</span>
            <span><span id="performer-count">21</span> 位演唱者</span>
          </span>
          <span class="summary-icon" aria-hidden="true"></span>
        </summary>
        <div class="disclosure-content">
          <ol id="performer-list" class="performer-list" aria-label="演唱者名单">
            <li class="loading-copy">正在读取名单…</li>
          </ol>
        </div>
      </details>
    </main>
  </body>
</html>
